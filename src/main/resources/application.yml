server:
  port: ${PORT}

spring:
  application:
    name: ms-gestion
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI}

ms-reasignacion:
  url: ${MS_REASIGNACION_URL:http://localhost:8083}

ms-notificaciones:
  url: ${MS_NOTIFICACIONES_URL:http://localhost:8085}

logging:
  level:
    org.springframework.security: DEBUG
